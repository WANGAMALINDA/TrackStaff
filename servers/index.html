<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#16866d" />
    <meta name="description" content="TrackServ field staff workspace for assigned municipal issues, attendance, progress, and resolution evidence." />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="googlebot" content="noindex, nofollow, noarchive" />
    <link rel="apple-touch-icon" href="/favicon-96x96.png" />
    <link rel="icon" href="/web-app-manifest-192x192.png" sizes="192x192" type="image/png" />
    <link rel="icon" href="/web-app-manifest-512x512.png" sizes="512x512" type="image/png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>TrackServ Staff Workspace</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Handle GitHub Pages redirect for SPA routing
      (function() {
        let redirect = sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          delete sessionStorage.redirect;
          // Extract the path after the base and navigate to it
          let path = redirect.substring(window.location.origin.length + '/TrackStaff'.length);
          if (!path) path = '/';
          window.history.replaceState(null, null, '/TrackStaff' + path);
        }
      })();
    </script>
  </body>
</html>
